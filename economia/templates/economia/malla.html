<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malla de conceptos · Economía para jóvenes</title>
{% verbatim %}
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    color: #fff; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b1229;
  }
  .barra {
    flex: none; display: flex; align-items: center; gap: .6rem 1.4rem; flex-wrap: wrap;
    padding: .55rem 1rem; background: rgba(8,12,28,.55); border-bottom: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(6px); z-index: 2;
  }
  .barra a { color: #9fd3ff; text-decoration: none; font-size: .9rem; }
  .barra a:hover { text-decoration: underline; }
  h1 { margin: 0; font-size: 1.1rem; letter-spacing: .02em; }
  .leyenda { display: flex; gap: .9rem; flex-wrap: wrap; font-size: .8rem; color: #cfd8ea; }
  .leyenda span { display: inline-flex; align-items: center; gap: .35rem; }
  .punto { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .progreso { margin-left: auto; display: flex; align-items: center; gap: .6rem; font-size: .9rem; }
  .pista { width: 150px; height: 9px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
  #relleno { height: 100%; width: 0; background: linear-gradient(90deg, #ffd54a, #ffb300); transition: width .3s; }
  button {
    font: inherit; cursor: pointer; color: #fff; background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: .3rem .8rem;
  }
  button:hover { background: rgba(255,255,255,.2); }
  button.principal { background: #ffc629; border-color: #ffc629; color: #1b1400; font-weight: 700; }
  button.principal:hover { background: #ffd34f; }

  .trama { display: none; }
  #mapa { flex: 1; min-height: 0; position: relative; z-index: 1; overflow: auto; display: flex; }
  #malla { display: block; margin: auto; flex: none; }
  #mensaje { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; color: #cfd8ea; pointer-events: none; }
  #mensaje.error { color: #ff9e9e; }
  #mensaje[hidden] { display: none; }

  /* Las líneas están ocultas al inicio: solo se ven el camino del concepto elegido y el rastro de lo aprendido. */
  .arista-borde { fill: none; stroke: #0d1735; stroke-width: 5.5; stroke-opacity: .9; stroke-linecap: round; opacity: 0; transition: opacity .15s; }
  .arista { fill: none; stroke: rgba(222,234,255,.42); stroke-width: 1.8; opacity: 0; transition: opacity .15s; }
  .arista.hecha { stroke: rgba(255,213,74,.65); stroke-width: 2.4; opacity: 1; }
  .arista-borde.hecha { opacity: .85; }
  .arista.ant { stroke: #4dd0e1; stroke-width: 3.2; opacity: 1; }
  .arista.des { stroke: #ff5ca8; stroke-width: 3.2; opacity: 1; }
  .arista-borde.ant, .arista-borde.des { stroke-width: 7; opacity: 1; }
  .arista.fuera, .arista-borde.fuera { opacity: 0; }
  .arista.hecha.fuera { opacity: .12; }
  .arista-borde.hecha.fuera { opacity: .1; }

  .nodo { cursor: pointer; outline: none; user-select: none; -webkit-user-select: none; transition: opacity .15s; }
  .nodo text { font-size: 13px; font-weight: 600; fill: #fff; text-anchor: middle; pointer-events: none;
               paint-order: stroke; stroke: #0a0f24; stroke-width: 3.5px; stroke-linejoin: round; }
  .nodo .cuerpo { stroke: rgba(255,255,255,.9); stroke-width: 2.2; transition: stroke .15s; }
  .nodo .icono { filter: drop-shadow(0 1px 1.2px rgba(0,0,0,.4)); }
  .nodo .halo { fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; opacity: 0; }
  .nodo.estado-bloqueado .cuerpo, .nodo.estado-bloqueado .icono { opacity: .4; filter: grayscale(.55); }
  .nodo.estado-bloqueado text { opacity: .65; }
  .nodo.estado-disponible .halo { opacity: 1; animation: pulso 1.9s ease-in-out infinite; }
  .nodo.estado-aprendido .cuerpo { stroke: #ffd54a; stroke-width: 4; filter: drop-shadow(0 0 7px rgba(255,213,74,.75)); }
  .nodo.fuera { opacity: .16; }
  .nodo.foco .cuerpo { stroke: #fff !important; stroke-width: 5 !important; }
  .nodo.ant .cuerpo { stroke: #4dd0e1 !important; stroke-width: 4 !important; }
  .nodo.des .cuerpo { stroke: #ff5ca8 !important; stroke-width: 4 !important; }
  .nodo:focus-visible .cuerpo { stroke: #fff; stroke-width: 5; }
  @keyframes pulso { 0%, 100% { stroke-opacity: .15; stroke-width: 1.5; } 50% { stroke-opacity: .85; stroke-width: 3.5; } }
  @media (prefers-reduced-motion: reduce) { .nodo.estado-disponible .halo { animation: none; stroke-opacity: .6; } }

  .tarjeta {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; max-width: calc(100vw - 20px);
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: center;
    padding: .5rem .7rem .5rem 1rem; border-radius: 14px; background: rgba(8,12,28,.92);
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .tarjeta strong { font-size: 1rem; }
  .tarjeta a.boton {
    color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.35);
    border-radius: 8px; padding: .3rem .8rem; background: rgba(255,255,255,.1);
  }
  .tarjeta a.boton:hover { background: rgba(255,255,255,.22); }
  .tarjeta[hidden] { display: none; }
</style>
{% endverbatim %}
</head>

  <a href="/">← Inicio</a>
  <h1>Malla de conceptos</h1>
  <div class="leyenda" id="leyenda"></div>
  <div class="progreso">
    <span id="contador">0 / 0</span>

</header>
<main id="mapa">

<div class="tarjeta" id="tarjeta" hidden>

</div>

  function partir(texto) {

  function clausura(slug, hacia) {
